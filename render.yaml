# Render Blueprint — one free web service serving API + WebSocket + UI + simulator.
# Deploy: Render dashboard -> New -> Blueprint -> connect this repo.
services:
  - type: web
    name: symbern-fleet-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL          # set to your Neon connection string (?sslmode=require)
        sync: false
      - key: JWT_SECRET            # auto-generated secret for signing sessions
        generateValue: true
      - key: RUN_SIMULATOR
        value: "1"
      - key: SIM_FLEET
        value: "30"
      - key: TRUSSED_API_KEY       # optional; leave unset to run without AI features
        sync: false
